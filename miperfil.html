<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="assets/css/perfil.css">
</head>
<body>
    <!--Cabecera-->
    <header>
        <nav>
            <a href="index.html"><img src="./assets/img/logo.png" alt="Ink Legacy Tattoo Studio - Logotipo oficial del estudio de tatuajes" height="90"></a>
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="sobrenosotros.html">SOBRE NOSOTROS</a></li>
                <li><a href="artistas.html">ARTISTAS</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
                <li><a href="login.html">ÁREA DE TATUADORES</a></li>
                <li style="display: none;"><a href="miperfil.html">MI PERFIL</a></li>
                <li style="display: none;"><a href="#" id="logout">CERRAR SESIÓN</a></li>
            </ul>
            <img src="./assets/img/menu.svg" alt="Abrir menú de navegación" id="menu-icon" height="40">
        </nav>
    </header>

    <main>
        <section>
            <h1>MI PERFIL</h1> 
            <div class="container">
                <div id="mensajes">
                    <h2>MENSAJES</h2>
                </div>

                <!-- Modificar perfil -->
                <form id="form-perfil" action="" method="post" enctype="multipart/form-data">
                    <div class="datos">
                        <div class="datos-personales">
                            <h2>DATOS PERSONALES</h2>
                            <p id="mensaje-perfil"></p>
                            <input type="text" id="nombre" name="nombre" required>
                            <label for="nombre" class="placeholder">Nombre</label>
                            <br>
                            <input type="email" id="email" name="email" disabled required>
                            <label for="email" class="placeholder">Email</label>
                            <br>
                            <input type="text" id="estilo" name="estilo" required>
                            <label for="estilo" class="placeholder">Estilo</label>
                            <br>
                            <input type="text" id="instagram" name="instagram" required>
                            <label for="instagram" class="placeholder">Instagram</label>
                            <br>
                            <label for="descripcion">Descripción</label><br>
                            <textarea id="descripcion" name="descripcion" rows="4" cols="50" required></textarea>
                            <br>
                            <button type="submit">Actualizar Perfil</button>
                        </div>
                        <div class="foto">
                            <img src="" alt="">
                            <input type="file" name="imagen" id="imagen" accept="image/*">
                        </div>
                    </div>
                </form>

                <!-- Modificar contraseña -->
                <form id="form-clave" action="" method="post">
                    <h2>MODIFICAR CONTRASEÑA</h2>
                    <p id="mensaje-clave"></p>
                    <input type="password" id="password" name="password" required>
                    <label for="password" class="placeholder">Contraseña</label>
                    <br>
                    <input type="password" id="confirmar_password" name="confirmar_password" required>
                    <label for="confirmar_password" class="placeholder">Confirmar Contraseña</label>
                    <br>
                    <button type="submit">Actualizar Contraseña</button>
                </form>

                <!-- Subir tatuajes -->
                <form id="form-tatuajes" action="" method="post" enctype="multipart/form-data">
                    <h2>SUBIR TATUAJES</h2>
                    <div id="mensaje-tatuajes"></div>
                    <label for="tatuajes">Tatuajes</label>
                    <input type="file" name="tatuajes[]" id="tatuajes" accept="image/*" multiple required>
                    <br>
                    <button type="submit">Subir Tatuajes</button>
                </form>

                <div class="galeria"></div>
            </div>   
        </section>
    </main>

    <script src="assets/js/miperfil.js"></script>
</body>
</html>
